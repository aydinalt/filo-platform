services:
  - type: web
    name: filo-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate:deploy && npm run start --workspace @filo/api
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: REQUEST_BODY_LIMIT_BYTES
        value: 1048576
      - key: REQUEST_TIMEOUT_MS
        value: 15000
      - key: AUTH_LOGIN_RATE_LIMIT_MAX
        value: 5
      - key: AUTH_LOGIN_RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_ADMIN_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NOTIFICATION_WORKER_KEY
        generateValue: true
      - key: NOTIFICATION_WEBHOOK_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
