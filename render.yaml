envVarGroups:
  - name: filo-runtime-secrets
    envVars:
      - key: NOTIFICATION_WORKER_KEY
        generateValue: true
      - key: NOTIFICATION_WEBHOOK_SECRET
        generateValue: true

services:
  - type: web
    name: filo-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate:deploy && npm run start --workspace @filo/api
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - fromGroup: filo-runtime-secrets
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: REQUEST_BODY_LIMIT_BYTES
        value: 1048576
      - key: REQUEST_TIMEOUT_MS
        value: 15000
      - key: AUTH_LOGIN_RATE_LIMIT_MAX
        value: 5
      - key: AUTH_LOGIN_RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: SESSION_RECORD_RETENTION_DAYS
        value: 30
      - key: SESSION_CLEANUP_BATCH_SIZE
        value: 200
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_ADMIN_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"

  - type: worker
    name: filo-notification-worker
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm run start --workspace @filo/worker
    maxShutdownDelaySeconds: 30
    envVars:
      - fromGroup: filo-runtime-secrets
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: WORKER_API_URL
        sync: false
      - key: NOTIFICATION_WORKER_ID
        value: render-worker-primary
      - key: WORKER_POLL_INTERVAL_MS
        value: 5000
      - key: WORKER_SCHEDULER_INTERVAL_MS
        value: 300000
      - key: WORKER_PROVIDER_TIMEOUT_MS
        value: 15000
      - key: WORKER_BATCH_SIZE
        value: 25
      - key: WORKER_SCHEDULER_ENABLED
        value: "true"
      - key: WORKER_ALLOW_DRY_RUN
        value: "false"
      - key: EMAIL_FROM
        sync: false
      - key: FILO_EMAIL_PROVIDER_KEY
        sync: false
