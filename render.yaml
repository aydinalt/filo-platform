services:
  - type: web
    name: filo-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm run start --workspace @filo/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
