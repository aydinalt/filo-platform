services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: filo
      POSTGRES_USER: filo
      POSTGRES_PASSWORD: filo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - filo_pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/000-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filo -d filo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  filo_pgdata:
